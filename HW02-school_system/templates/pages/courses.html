<section class="content-placeholder">
  <h1>課程查詢</h1>
  <p class="muted">v0.4.0 將串接選課系統 API，目前為示意資料。</p>
  <table class="data-table">
    <thead>
      <tr><th>代碼</th><th>科目</th><th>學分</th><th>授課教師</th><th>時段</th></tr>
    </thead>
    <tbody>
      {% for c in demo_courses %}
        <tr>
          <td><code>{{ c.code }}</code></td>
          <td>{{ c.name }}</td>
          <td>{{ c.credits }}</td>
          <td>{{ c.teacher }}</td>
          <td>{{ c.time }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
