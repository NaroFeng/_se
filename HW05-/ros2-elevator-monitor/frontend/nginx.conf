# =====================================================================
# Nginx 設定：web-frontend
#   1. 託管前端監控儀表板（/usr/share/nginx/html）
#   2. /api/*      -> web-backend:8000（REST 反向代理）
#   3. /rosbridge  -> ros2-bridge:9090（WebSocket 反向代理）
# =====================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------- 記錄格式 ----------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # ---------------- 基本最佳化 ----------------
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size  16m;
    server_tokens   off;

    # WebSocket 需要的 Connection header 映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 壓縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript
               image/svg+xml;

    # =================================================================
    # 上游服務（Docker Compose 服務名稱）
    #
    # 注意 1：不可使用 upstream {} 區塊。
    #   nginx 在啟動時會立即解析 upstream 主機名，若 backend 尚未就緒
    #   就會以 "host not found in upstream" 直接啟動失敗。
    #   改用 resolver + 變數形式 proxy_pass，讓 DNS 解析延後到第一次請求時進行。
    #
    # 注意 2：主機名稱必須是 docker-compose.yml 的「服務名稱」（backend / ros2-bridge），
    #   而非 container_name（elevator-backend）。Docker 內建 DNS 兩者皆可解析，
    #   但服務名稱較具移植性。
    # =================================================================
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 內建 DNS

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        # 供 proxy_pass 使用的上游位址（以變數形式避免啟動時解析）
        set $backend_upstream  http://backend:8000;
        set $rosbridge_upstream http://ros2-bridge:9090;

        root  /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        # ---------------- 前端靜態頁面 ----------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------- API 反向代理 ----------------
        location /api/ {
            proxy_pass         $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
            proxy_buffering        off;
        }

        # Swagger UI / OpenAPI（後端以 /docs 與 /api/docs 提供）
        location = /docs          { proxy_pass $backend_upstream/docs;           include /etc/nginx/conf.d/proxy_common.conf; }
        location = /redoc         { proxy_pass $backend_upstream/redoc;          include /etc/nginx/conf.d/proxy_common.conf; }
        location = /openapi.json  { proxy_pass $backend_upstream/openapi.json;  include /etc/nginx/conf.d/proxy_common.conf; }

        # ---------------- rosbridge WebSocket 反向代理 ----------------
        location /rosbridge {
            proxy_pass         $rosbridge_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;

            # WebSocket 是長連線，逾時設大一些
            proxy_connect_timeout  10s;
            proxy_send_timeout     3600s;
            proxy_read_timeout     3600s;
            proxy_buffering        off;
        }

        # ---------------- 健康檢查 ----------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---------------- 靜態資源快取 ----------------
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
        }
    }
}